    if (cur === steps.length - 1) { next.setAttribute('aria-busy', 'true'); next.innerHTML = '<svg class="u-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path class="u-draw" pathLength="100" d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>Connecting…'; setTimeout(function () { next.removeAttribute('aria-busy'); done = [0, 1, 2, 3]; cur = 0; key = ''; render(1, '<div class="u-alert u-alert--success"><span class="u-alert-icon"><svg class="u-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="u-alert-body"><div class="u-alert-title">Provider connected</div><div class="u-alert-text">OpenAI is ready. Auto routing is on.</div></div></div>'); done = []; }, 1400); return; }
    if (done.indexOf(cur) === -1) done.push(cur);
    cur += 1; render(1);
  });
  back.addEventListener('click', function () { if (cur > 0) go(cur - 1); });
  render();
</script>
