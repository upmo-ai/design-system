<!-- @dsCard group="Foundations" height=1320 width=1280 subtitle="Every concept in icons.json, drawn from the live Tabler 3.31 sprite. The caret stands in where the map says so" -->
<style>
  .im-wrap { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .im-head { display: flex; align-items: center; gap: 12px; }
  .im-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .im-cell { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-100); color: var(--ink); }
  .im-cell svg { width: 20px; height: 20px; flex: none; stroke-width: 1.75; }
  .im-cell .im-caret { color: var(--emerald-deep); }
  .im-cell .im-name { font-size: 12px; line-height: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .im-cell .im-name b { display: block; font-weight: 600; }
  .im-cell .im-name span { color: var(--ink-muted); }
  .im-group { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 8px 0 0; }
  .im-missing { color: var(--danger); font-size: 13px; }
</style>
<div class="im-wrap">
  <div class="im-head">
    <div class="u-seg" role="group" aria-label="Icon size" id="im-size">
      <button aria-pressed="false" data-size="16">16</button><button aria-pressed="true" data-size="20">20</button><button aria-pressed="false" data-size="24">24</button>
    </div>
    <span id="im-count" class="u-caption" style="color: var(--ink-muted)">Loading the Tabler sprite…</span>
  </div>
  <div id="im-root"></div>
</div>
<script>
(function () {
  var map = {"nav":{"tasks":"list-check","chats":"message","agents":"users","automations":"clock-play","knowledge":"books","memory":"brain","usage":"chart-bar","notifications":"bell","settings":"settings","search":"search","command_palette":"command","sidebar":"layout-sidebar","menu":"menu-2","back":"arrow-left","forward":"arrow-right","home":"home","external":"external-link","scroll_top":"caret"},
    "action":{"add":"plus","edit":"pencil","delete":"trash","remove":"x","close":"x","copy":"copy","copied":"caret","download":"download","upload":"upload","attach":"paperclip","send":"caret","stop":"player-stop","pause":"player-pause","resume":"player-play","retry":"refresh","regenerate":"refresh","pin":"pin","pinned":"pinned","archive":"archive","unarchive":"archive-off","more":"dots","more_vertical":"dots-vertical","filter":"filter","sort":"arrows-sort","expand":"chevron-down","collapse":"caret","next":"chevron-right","previous":"chevron-left","link":"link","share":"share","approve":"caret","deny":"x","follow_up":"corner-down-right","dictate":"microphone","theme_light":"sun","theme_dark":"moon","sign_in":"login","sign_out":"logout","reveal":"eye","hide":"eye-off","drag":"grip-vertical","maximize":"maximize","minimize":"minimize","table_view":"table","chart_view":"chart-bar","zoom_in":"zoom-in","zoom_out":"zoom-out","notifications":"bell","notifications_off":"bell-off","keyboard":"keyboard"},
    "status":{"idle":"status-idle","preparing":"status-plan","planning":"status-plan","working":"status-build","checking":"status-build","done":"status-done","failed":"status-failed","needs_approval":"clock","paused":"player-pause","queued":"hourglass","stopped":"x","loading":"caret","success":"caret","info":"info-circle","warning":"alert-triangle","danger":"alert-circle","help":"help","locked":"lock","unlocked":"lock-open","verified":"shield-check","online":"wifi","offline":"wifi-off"},
    "phase":{"preparing":"search","planning":"list-details","working":"hammer","checking":"shield-check","done":"flag"},
    "object":{"task":"list-check","chat":"message","agent":"user-hexagon","provider":"plug","model":"cpu","connector":"plug-connected","mcp":"server","repository":"git-branch","github":"brand-github","sandbox":"box","artifact":"file","code":"code","terminal":"terminal-2","database":"database","tokens":"coins","budget":"wallet","cost":"receipt","schedule":"calendar-clock","calendar":"calendar","timezone":"world","user":"user","team":"users","email":"mail","file_pdf":"file-type-pdf","file_text":"file-text","file_code":"file-code","json":"braces","image":"photo","audio":"file-music","folder":"folder","tag":"tag","key":"key","skill":"book","memory":"brain","source":"file-search","automation":"clock-play","workflow":"git-merge","delivery":"send","tool_call":"tool","sql":"database","web":"world-www","version":"versions"}};
  var own = {
    "caret": '<svg viewBox="0 0 64 64" fill="none" class="im-caret" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "status-idle": '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="var(--mist)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "status-plan": '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 22l22 22" stroke="var(--mist)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "status-build": '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "status-done": '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="var(--emerald)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "status-failed": '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M16 16l32 32M48 16 16 48" stroke="var(--danger)" stroke-width="10" stroke-linecap="round"/></svg>'
  };
  var root = document.getElementById('im-root'), count = document.getElementById('im-count');
  var groups = ['nav', 'action', 'status', 'phase', 'object'];
  var titles = { nav: 'Navigation', action: 'Actions', status: 'Status', phase: 'Phases', object: 'Objects' };
  function render(ids) {
    var html = '', n = 0, miss = [];
    groups.forEach(function (g) {
      html += '<div class="im-group">' + titles[g] + '</div><div class="im-grid">';
      Object.keys(map[g]).forEach(function (k) {
        var name = map[g][k], svg;
        if (own[name]) svg = own[name];
        else if (ids && ids.indexOf('tabler-' + name) >= 0) svg = '<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#tabler-' + name + '"/></svg>';
        else { svg = '<span class="im-missing">?</span>'; miss.push(name); }
        html += '<div class="im-cell">' + svg + '<div class="im-name"><b>' + k.replace(/_/g, ' ') + '</b><span>' + name + '</span></div></div>'; n++;
      });
      html += '</div>';
    });
    root.innerHTML = html;
    count.textContent = n + ' concepts' + (ids ? ', ' + (miss.length ? miss.length + ' missing: ' + miss.join(', ') : 'all names found in the sprite') : ', sprite not reachable (offline); Upmo marks shown');
  }
  fetch('https://cdn.jsdelivr.net/npm/@tabler/icons-sprite@3.31.0/dist/tabler-sprite.svg').then(function (r) { return r.text(); }).then(function (txt) {
    var holder = document.createElement('div'); holder.style.display = 'none'; holder.innerHTML = txt; document.body.appendChild(holder);
    var ids = []; holder.querySelectorAll('symbol[id]').forEach(function (s) { ids.push(s.id); });
    render(ids);
  }).catch(function () { render(null); });
  render(null);
  document.getElementById('im-size').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    root.querySelectorAll('.im-cell svg').forEach(function (s) { s.style.width = s.style.height = b.dataset.size + 'px'; });
  });
})();
</script>
