<!-- @dsCard group="Forms" height=560 page subtitle="A complete form: layout, validation on submit, focus to first error, success toast" -->
<div class="u-preview u-preview--col" style="max-width: 560px">
  <form id="fx" novalidate class="u-stack" style="gap: 24px">
    <div class="u-stack" style="gap: 4px">
      <h3 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">New automation</h3>
      <div class="u-desc">Runs a task on a schedule and sends the result where you say.</div>
    </div>
    <div id="fx-summary" hidden class="u-alert u-alert--danger" role="alert"><svg class="u-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><div class="u-alert-body"><div class="u-alert-title">Fix 2 fields to continue</div><div class="u-alert-text" id="fx-summary-text"></div></div></div>
    <div class="u-field"><label class="u-label" for="fx-name">Name</label><input class="u-input" id="fx-name" placeholder="Daily finance digest" aria-describedby="fx-name-msg"><div class="u-msg" id="fx-name-msg"></div></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
      <div class="u-field"><label class="u-label" for="fx-sched" id="fx-sched-l">Schedule</label><div class="u-select"><button type="button" class="u-input u-select-trigger" id="fx-sched" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="fx-sched-list" aria-labelledby="fx-sched-l" aria-describedby="fx-sched-desc"><span class="u-select-value"></span><span class="u-select-caret"><svg class="u-icon u-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="u-select-drop"><div class="u-select-options" role="listbox" id="fx-sched-list" aria-labelledby="fx-sched-l"><div class="u-opt" role="option" aria-selected="true"><span class="u-opt-label">Every weekday at 08:00</span></div><div class="u-opt" role="option"><span class="u-opt-label">Every hour</span></div><div class="u-opt" role="option"><span class="u-opt-label">Custom cron</span></div></div></div></div><div class="u-desc" id="fx-sched-desc">Europe/Amsterdam</div></div>
      <div class="u-field"><label class="u-label" for="fx-to">Send result to</label><input class="u-input" id="fx-to" placeholder="name@company.com" inputmode="email" aria-describedby="fx-to-msg"><div class="u-msg" id="fx-to-msg"></div></div>
    </div>
    <div class="u-field"><label class="u-label" for="fx-goal">Goal</label><textarea class="u-input" id="fx-goal" rows="3" placeholder="What should the agent deliver each run?"></textarea></div>
    <div class="u-stack" style="gap: 10px">
      <span class="u-label">Tools</span>
      <label class="u-check"><input type="checkbox" checked><span class="u-box"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="u-check-text">Read the knowledge base</span></label>
      <label class="u-check"><input type="checkbox"><span class="u-box"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="u-check-text">Search the web</span></label>
    </div>
    <label class="u-switch"><input type="checkbox" checked><span class="u-track"></span><span>Enable now</span></label>
    <div class="u-row" style="justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 16px">
      <button type="button" class="u-btn u-btn--subtle">Cancel</button>
      <button type="submit" class="u-btn u-btn--filled" id="fx-submit">Create automation</button>
    </div>
  </form>
  <div id="fx-toast" hidden class="u-toast u-toast--success" role="status" style="align-self: flex-end"><svg class="u-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="u-toast-body"><div class="u-toast-title">Automation created</div><div class="u-toast-text">First run tomorrow at 08:00.</div></div></div>
</div>
<script>
  // Custom select: a combobox trigger and a listbox panel. One function for Select and MultiSelect; each preview carries the same copy.
  function uSelect(root) {
    var cb = root.querySelector('[role="combobox"]'), list = root.querySelector('[role="listbox"]'), field = root.querySelector('.u-select-trigger');
    var value = root.querySelector('.u-select-value'), empty = root.querySelector('.u-select-empty');
    var search = root.querySelector('.u-select-search input') || (cb.tagName === 'INPUT' ? cb : null), host = search || cb;
    var multi = list.getAttribute('aria-multiselectable') === 'true', opts = [].slice.call(list.querySelectorAll('[role="option"]'));
    var active = null, typed = '', typedAt = 0;
    var check = '<svg class="u-opt-check" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var x = '<svg class="u-icon u-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    opts.forEach(function (o, i) { o.id = o.id || list.id + '-' + i; o.setAttribute('aria-selected', String(o.getAttribute('aria-selected') === 'true')); o.insertAdjacentHTML('beforeend', check); });
    function label(o) { return (o.querySelector('.u-opt-label') || o).textContent.trim(); }
    function isOpen() { return root.getAttribute('data-open') === 'true'; }
    function chosen() { return opts.filter(function (o) { return o.getAttribute('aria-selected') === 'true'; }); }
    function usable() { return opts.filter(function (o) { return !o.hidden && o.getAttribute('aria-disabled') !== 'true'; }); }
    function setActive(o) {
      if (active) active.removeAttribute('data-active');
      active = o || null;
      if (!active) return host.removeAttribute('aria-activedescendant');
      active.setAttribute('data-active', 'true');
      host.setAttribute('aria-activedescendant', active.id);
      if (active.offsetTop < list.scrollTop) list.scrollTop = active.offsetTop;
      else if (active.offsetTop + active.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = active.offsetTop + active.offsetHeight - list.clientHeight;
    }
    function open() {
      if (isOpen() || cb.disabled) return;
      root.setAttribute('data-open', 'true');
      cb.setAttribute('aria-expanded', 'true');
      if (search && search !== cb) search.focus();
      setActive(chosen().filter(function (o) { return usable().indexOf(o) > -1; })[0] || usable()[0]);
    }
    function close(refocus) {
      if (!isOpen()) return;
      root.setAttribute('data-open', 'false');
      cb.setAttribute('aria-expanded', 'false');
      setActive(null);
      if (search) { search.value = ''; filter(); }
      if (refocus) cb.focus();
    }
    function changed() { paint(); root.dispatchEvent(new Event('change')); }
    function paint() {
      if (!multi) { value.textContent = chosen()[0] ? label(chosen()[0]) : ''; return; }
      field.querySelectorAll('.u-pill').forEach(function (p) { p.remove(); });
      chosen().forEach(function (o) {
        var pill = document.createElement('span'), remove = document.createElement('button');
        pill.className = 'u-pill';
        pill.textContent = label(o);
        remove.type = 'button';
        remove.tabIndex = -1;
        remove.setAttribute('aria-label', 'Remove ' + label(o));
        remove.innerHTML = x;
        remove.addEventListener('mousedown', function (e) { e.preventDefault(); });
        remove.addEventListener('click', function (e) { e.stopPropagation(); o.setAttribute('aria-selected', 'false'); changed(); });
        pill.appendChild(remove);
        field.insertBefore(pill, cb);
      });
    }
    function pick(o) {
      if (!o || o.getAttribute('aria-disabled') === 'true') return;
      if (multi) {
        o.setAttribute('aria-selected', String(o.getAttribute('aria-selected') !== 'true'));
        changed();
        if (search.value) { search.value = ''; filter(); }
        return setActive(o);
      }
      opts.forEach(function (other) { other.setAttribute('aria-selected', String(other === o)); });
      changed();
      close(true);
    }
    function filter() {
      var q = search ? search.value.trim().toLowerCase() : '';
      opts.forEach(function (o) { o.hidden = q !== '' && o.textContent.toLowerCase().indexOf(q) < 0; });
      list.querySelectorAll('[role="group"]').forEach(function (g) { g.hidden = !g.querySelector('[role="option"]:not([hidden])'); });
      if (empty) empty.textContent = opts.some(function (o) { return !o.hidden; }) ? '' : 'No matches';
      if (isOpen()) setActive(usable()[0]);
    }
    function typeahead(ch) {
      var now = Date.now(), u = usable();
      typed = now - typedAt > 500 ? ch : typed + ch;
      typedAt = now;
      var from = u.indexOf(active) + (typed.length === 1 ? 1 : 0), order = u.slice(from).concat(u.slice(0, from));
      var hit = order.filter(function (o) { return label(o).toLowerCase().indexOf(typed) === 0; })[0];
      if (hit) setActive(hit);
    }
    function onKey(e) {
      var k = e.key, inText = e.target === search, u = usable(), i = u.indexOf(active);
      var printable = k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
      if (multi && k === 'Backspace' && !search.value && chosen().length) { chosen().pop().setAttribute('aria-selected', 'false'); return changed(); }
      if (!isOpen()) {
        if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Enter' || (k === ' ' && !inText)) { e.preventDefault(); open(); }
        else if (printable && !inText) { e.preventDefault(); open(); if (search) { search.value = k; filter(); } else typeahead(k.toLowerCase()); }
        return;
      }
      if (k === 'ArrowDown') { e.preventDefault(); setActive(u[Math.min(i + 1, u.length - 1)]); }
      else if (k === 'ArrowUp') { e.preventDefault(); setActive(u[Math.max(i - 1, 0)]); }
      else if ((k === 'Home' || k === 'End') && !(search && search.value)) { e.preventDefault(); setActive(k === 'Home' ? u[0] : u[u.length - 1]); }
      else if (k === 'Enter' || (k === ' ' && !inText)) { e.preventDefault(); pick(active); }
      else if (k === 'Escape') { e.preventDefault(); close(true); }
      else if (k === 'Tab') close(false);
      else if (printable && !inText) typeahead(k.toLowerCase());
    }
    cb.addEventListener('keydown', onKey);
    if (search && search !== cb) search.addEventListener('keydown', onKey);
    if (search) search.addEventListener('input', function () { open(); filter(); });
    field.addEventListener('click', function () {
      if (multi) { cb.focus(); open(); } else if (isOpen()) close(true); else open();
    });
    list.addEventListener('mousedown', function (e) { e.preventDefault(); });
    list.addEventListener('click', function (e) { pick(e.target.closest('[role="option"]')); });
    list.addEventListener('mousemove', function (e) {
      var o = e.target.closest('[role="option"]');
      if (o && o !== active && o.getAttribute('aria-disabled') !== 'true') setActive(o);
    });
    document.addEventListener('pointerdown', function (e) { if (!root.contains(e.target)) close(false); });
    root.addEventListener('focusout', function (e) { if (e.relatedTarget && !root.contains(e.relatedTarget)) close(false); });
    filter();
    paint();
  }
  document.querySelectorAll('.u-select').forEach(uSelect);
  var f = document.getElementById('fx'), sub = document.getElementById('fx-submit');
  function err(id, text) {
    var i = document.getElementById(id), m = document.getElementById(id + '-msg');
    i.setAttribute('aria-invalid', !!text);
    m.className = 'u-msg' + (text ? ' u-msg--error' : '');
    m.innerHTML = text ? '<svg class="u-icon u-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>' + text : '';
    return !!text;
  }
  function validate() {
    var e = [];
    if (err('fx-name', document.getElementById('fx-name').value.trim() ? '' : 'Give the automation a name.')) e.push('Name');
    var to = document.getElementById('fx-to').value.trim();
    if (err('fx-to', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to) ? '' : 'Enter an email address, like finance@company.com.')) e.push('Send result to');
    return e;
  }
  ['fx-name', 'fx-to'].forEach(function (id) { var i = document.getElementById(id); i.addEventListener('input', function () { if (i.getAttribute('aria-invalid') === 'true') validate(); }); });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var e = validate(), s = document.getElementById('fx-summary');
    if (e.length) {
      s.hidden = false; s.querySelector('.u-alert-title').textContent = 'Fix ' + e.length + ' field' + (e.length > 1 ? 's' : '') + ' to continue';
      document.getElementById('fx-summary-text').textContent = e.join(', ');
      f.querySelector('[aria-invalid="true"]').focus(); return;
    }
    s.hidden = true; sub.setAttribute('aria-busy', 'true'); var w = sub.offsetWidth; sub.style.minWidth = w + 'px';
    sub.innerHTML = '<svg class="u-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path class="u-draw" pathLength="100" d="M10 44 32 22l22 22" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>Creating…';
    setTimeout(function () { sub.removeAttribute('aria-busy'); sub.textContent = 'Create automation'; sub.style.minWidth = ''; document.getElementById('fx-toast').hidden = false; setTimeout(function () { document.getElementById('fx-toast').hidden = true; }, 5000); }, 1400);
  });
</script>
