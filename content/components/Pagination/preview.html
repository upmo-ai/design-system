<script>
  var p = document.querySelector('[data-pager]');
  p.querySelectorAll('button:not([aria-label])').forEach(function (b) { b.addEventListener('click', function () { p.querySelectorAll('button').forEach(function (x) { x.removeAttribute('aria-current'); }); b.setAttribute('aria-current', 'page'); }); });
</script>
