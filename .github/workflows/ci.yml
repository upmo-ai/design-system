name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # Corepack installs the pnpm version pinned in package.json#packageManager.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Same order as the release gate.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # The brand kit is generated and committed; fail if it is out of date.
      - run: pnpm --filter @upmo-ai/brand generate --check

  # The checks that need a real browser (layout, SVG, computed colours). They skip
  # under `pnpm test` (jsdom); this job runs them in Playwright's image. The command
  # and the image tag are the ones in CONTRIBUTING.md.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v1.61.1-noble \
            sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @upmo-ai/components test:browser"
